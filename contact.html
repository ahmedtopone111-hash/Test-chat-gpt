<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact | Ahmed Dev</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <header class="navbar">
    <a href="index.html" class="logo">AHMED<span>.DEV</span></a>
    <button class="menu-btn" id="menuBtn">☰</button>
    <nav id="navLinks">
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
      <a href="projects.html">Projects</a>
      <a href="contact.html">Contact</a>
      <button id="themeBtn">☼</button>
    </nav>
  </header>

  <main class="intro">
    <p class="eyebrow">04 / CONTACT</p>
    <h1>Let's make something <span>matter.</span></h1>
    <p>Have an idea or want to connect? Send me a message.</p>

    <form id="contactForm">
      <p><label for="name">Your name</label></p>
      <input id="name" required placeholder="Your name">

      <p><label for="email">Your email</label></p>
      <input id="email" type="email" required placeholder="you@example.com">

      <p><label for="message">Your message</label></p>
      <textarea id="message" rows="5" required
        placeholder="Tell me about your idea"></textarea>

      <button class="primary-btn" type="submit">
        Prepare email ↗
      </button>
    </form>
  </main>

  <footer>
    <a href="index.html" class="logo">AHMED<span>.DEV</span></a>
    <p>© <span id="year"></span></p>
    <button id="backTop">BACK TO TOP ↑</button>
  </footer>

  <script>
    document.querySelector("#contactForm")
      .addEventListener("submit", function(event) {
        event.preventDefault();

        const name = document.querySelector("#name").value;
        const email = document.querySelector("#email").value;
        const message = document.querySelector("#message").value;

        const subject = encodeURIComponent("Portfolio message from " + name);
        const body = encodeURIComponent(
          "Name: " + name +
          "\\nEmail: " + email +
          "\\n\\n" + message
        );

        // Replace with your real email address.
        window.location.href =
          "mailto:hello@example.com?subject=" +
          subject + "&body=" + body;
      });
  </script>
</body>
</html>
